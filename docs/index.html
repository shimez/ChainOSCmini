<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>ChainOSCmini</title>
  <meta name="description" content="ChainOSCminiのWeb Installer案内ページです。">
  <style>
    :root{color-scheme:dark;--bg:#090d18;--text:#f8fafc;--muted:#aab4c5;--line:#2a3850;--accent:#7c5cff;--accent2:#4f8cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 50% -10%,#24345d 0,transparent 38%),var(--bg)}main{width:min(760px,calc(100% - 32px));margin:0 auto;padding:70px 0 44px;text-align:center}h1{margin:0;font-size:clamp(36px,8vw,56px);letter-spacing:-.04em}.lead{margin:15px auto 0;color:var(--muted);font-size:18px;line-height:1.75}.card{margin-top:34px;padding:30px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,#121b2c,#0f1726);box-shadow:0 24px 65px #0006}.button{display:inline-block;margin-top:18px;padding:14px 24px;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:700;text-decoration:none}.note{margin:26px auto 0;color:#c7d0df;font-size:13px;line-height:1.65}footer{margin-top:24px;color:#77849a;font-size:13px}footer a{color:#aebdf7}
  </style>
</head>
<body>
  <main>
    <h1>ChainOSCmini</h1>
    <p class="lead">Chain DualKey上で動作する、開発中の小型OSCコントローラーです。</p>
    <section class="card">
      <h2>Web Installer</h2>
      <p class="lead">デスクトップ版ChromeまたはEdgeからファームウェアを書き込めます。</p>
      <a class="button" href="installer/">Web Installerを開く</a>
    </section>
    <p class="note">ChainOSCminiは個人が開発する非公式プロジェクトであり、M5Stack Technology Co., Ltd.の公式製品ではありません。</p>
    <footer><a href="https://github.com/shimez/ChainOSCmini">GitHub Repository</a></footer>
  </main>
</body>
</html>
